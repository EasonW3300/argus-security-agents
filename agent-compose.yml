    volumes:
      - type: bind
        source: ./agent-compose-results
        target: /workspace/agent-compose-results
        read_only: false
    env:
      AGENT_PROVIDER: ${AGENT_PROVIDER}
      AGENT_MODEL: ${AGENT_MODEL}
      AGENT_API_KEY:
        value: ${AGENT_API_KEY}
        secret: true
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      AGENT_RESPONSE_MODE: ${AGENT_RESPONSE_MODE}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS}
      DASHSCOPE_API_KEY:
        value: ${DASHSCOPE_API_KEY}
        secret: true
      DEEPSEEK_API_KEY:
        value: ${DEEPSEEK_API_KEY}
        secret: true
      OPENAI_API_KEY:
